<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Resume Screener</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="deck">

    <!-- ===== Header ===== -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">Smart Resume Screener</span>
      </div>
      <div class="brand-tag">paste &nbsp;→&nbsp; scan &nbsp;→&nbsp; decide</div>
    </header>

    <!-- ===== Main workspace ===== -->
    <main class="workspace">

      <!-- LEFT: inputs -->
      <section class="panel input-panel">
        <div class="field">
          <label for="jobDescription">
            <span class="field-index">01</span> Job description
          </label>
          <textarea id="jobDescription" placeholder="Paste the job posting here — responsibilities, required skills, qualifications…"></textarea>
        </div>

        <div class="field">
          <label for="resumeText">
            <span class="field-index">02</span> Resume text
          </label>
          <textarea id="resumeText" placeholder="Paste the candidate's resume text here…"></textarea>
        </div>

        <div class="actions">
          <button id="screenBtn" class="btn-primary">
            <span class="btn-label">Scan resume</span>
            <span class="btn-icon">→</span>
          </button>
          <button id="sampleBtn" class="btn-ghost">Load sample</button>
        </div>

        <p id="errorMsg" class="error-msg" hidden></p>
      </section>

      <!-- RIGHT: results -->
      <section class="panel result-panel">

        <!-- idle state -->
        <div id="idleState" class="idle-state">
          <div class="scan-doc">
            <div class="scan-doc-line"></div>
            <div class="scan-doc-line short"></div>
            <div class="scan-doc-line"></div>
            <div class="scan-doc-line short"></div>
            <div class="scan-doc-line"></div>
          </div>
          <p>Results will appear here after you scan a resume.</p>
        </div>

        <!-- loading state -->
        <div id="loadingState" class="loading-state" hidden>
          <div class="scanner-frame">
            <div class="scanner-beam"></div>
            <div class="scan-doc-line"></div>
            <div class="scan-doc-line short"></div>
            <div class="scan-doc-line"></div>
            <div class="scan-doc-line short"></div>
          </div>
          <p>Scanning for keyword matches…</p>
        </div>

        <!-- results state -->
        <div id="resultsState" class="results-state" hidden>

          <div class="score-block">
            <div class="score-dial">
              <svg viewBox="0 0 120 120" class="dial-svg">
                <circle cx="60" cy="60" r="52" class="dial-track" />
                <circle cx="60" cy="60" r="52" class="dial-fill" id="dialFill" />
              </svg>
              <div class="dial-number">
                <span id="scoreValue">0</span><span class="dial-percent">%</span>
              </div>
            </div>
            <div class="score-copy">
              <p class="score-label">Match score</p>
              <p id="scoreVerdict" class="score-verdict">—</p>
            </div>
          </div>

          <div class="chip-block">
            <p class="chip-heading">
              <span class="dot dot-matched"></span> Matched skills
            </p>
            <div id="matchedChips" class="chip-row"></div>
          </div>

          <div class="chip-block">
            <p class="chip-heading">
              <span class="dot dot-missing"></span> Missing skills
            </p>
            <div id="missingChips" class="chip-row"></div>
          </div>

          <div class="tips-block">
            <p class="chip-heading">Notes</p>
            <ul id="tipsList" class="tips-list"></ul>
          </div>

        </div>

      </section>

    </main>

    <footer class="footer-note">
      Backend: <code id="apiUrlLabel">http://localhost:5000</code>
    </footer>

  </div>

<script src="script.js"></script>
</body>
</html>
